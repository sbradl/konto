[tools]
go            = "1.27.4"
golangci-lint = "2.15.0"
gotestsum     = "1.13.0"
hledger       = "1.52.4"   # hard runtime dep, spec requires >= 1.32; startup preflight also checks
"go:github.com/go-gremlins/gremlins/cmd/gremlins" = "0.6.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
gh = "latest"

[env]
# keep tool-installed binaries + `go install` output on PATH inside tasks
_.path = ["{{config_root}}/bin"]

# ---------------------------------------------------------------------------
# Tasks — run `mise tasks` to list, `mise run <name>` to invoke.
# ---------------------------------------------------------------------------

[tasks.build]
description = "Compile every package"
run = "go build ./..."

[tasks.vet]
description = "go vet (incl. integration and e2e build tags)"
run = "go vet -tags integration,e2e ./..."

[tasks.lint]
description = "golangci-lint"
run = "golangci-lint run"

[tasks.fmt]
description = "Format (writes) with the formatters lint enforces (gofumpt, goimports)"
run = "golangci-lint fmt"

[tasks.test]
description = "Unit tests (race, no hledger integration suite)"
run = "gotestsum --format pkgname -- -race -count=1 ./..."

[tasks."test:integration"]
description = "Full suite incl. tests that shell out to the real hledger binary"
run = "gotestsum --format standard-verbose -- -race -count=1 -tags integration ./..."

[tasks."test:e2e"]
description = "Gherkin e2e suite against the compiled binary (needs real hledger). Extra args go to godog: mise run test:e2e -- -godog.tags=@spec-4.5"
run = 'gotestsum --format standard-verbose -- -count=1 -timeout 30m -tags e2e ./e2e -args {{arg(name="godog", var=true, default="")}}'

[tasks.vuln]
description = "Known-vulnerability scan of reachable code (govulncheck)"
run = "govulncheck -tags integration,e2e ./..."

[tasks.tidy]
description = "Fail if go.mod/go.sum are not tidy"
run = "go mod tidy -diff"

[tasks.cover]
description = "Write coverage.out and print the total"
run = '''
go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
# cmd/konto/entry.go is only main(), the process entry point (real os.Args, os.Exit, clock, tty); the
# start-up sequence (app) and the port wiring (buildPorts) live in main.go and are covered. Recorded reason
# for the exclusion.
grep -v '/cmd/konto/entry.go:' coverage.out > coverage.filtered && mv coverage.filtered coverage.out
go tool cover -func=coverage.out | tail -n1
'''

[tasks."cover:html"]
description = "Open coverage.out as an HTML report"
depends = ["cover"]
run = "go tool cover -html=coverage.out -o coverage.html && echo wrote coverage.html"

[tasks."cover:check"]
description = "Fail if total coverage < THRESHOLD (default 100)"
depends = ["cover"]
env = { THRESHOLD = "100" }
run = '''
total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/,"",$3); print $3 }')
printf 'total coverage: %s%%  (threshold %s%%)\n' "$total" "$THRESHOLD"
awk -v t="$total" -v th="$THRESHOLD" 'BEGIN { exit (t + 0 < th + 0) }'
'''

# Mutation gate: efficacy (% of covered mutants killed) at the max, in .gremlins.yaml since gremlins
# 0.6.0 ignores the --threshold-* flags; loosen it there only with a reason (that file says why there is
# no mutant-coverage threshold). GOFLAGS=-count=1: gremlins times each mutant by its first test
# run, and a cached one takes ~0s, so every mutant would "time out" and the run pass falsely.
# gremlins takes a DIRECTORY and recurses (not the `go` `./...` pattern); "." = whole module.
# Cuts to shrink the run (user decision 2026-11-24): screens (internal/ui) skip the +/- swap and the minus-sign
# flip (--arithmetic-base=false --invert-negatives=false): there they are string joins, widths and offsets,
# ~665 of ~1,740 mutants. Everything else, the money arithmetic above all, keeps every mutant. Test helpers
# (e2e/, internal/ui/uitest/) are not mutated at all. So each task runs gremlins twice: the rest, then the
# screens. The screens pass runs from the root, everything outside internal/ui excluded: --diff wants root paths.
# scripts/unleash.sh passes a run with no mutant at all, which gremlins would fail at 0% efficacy.
[tasks.mutation]
description = "Mutation testing (gremlins). Scope it: mise run mutation internal/domain"
env = { GOFLAGS = "-count=1" }
usage = 'arg "[dir]" default="."'
run = '''
set -e
dir="${usage_dir:-.}"
opts="--coverpkg=./... --timeout-coefficient=4"
case "$dir" in
  internal/ui*) scripts/unleash.sh $opts --arithmetic-base=false --invert-negatives=false "$dir" ;;
  .) scripts/unleash.sh $opts -E '^(e2e|internal/ui)/' . &&
     scripts/unleash.sh $opts --arithmetic-base=false --invert-negatives=false \
       -E '^(cmd|e2e)/|^internal/([^u]|u[^i]|ui[^/])|^internal/ui/uitest/' . ;;
  *) scripts/unleash.sh $opts "$dir" ;;
esac
'''

[tasks."mutation:diff"]
description = "Mutation testing only on lines changed since the branch left main, or in the last commit on a clean main (fast, for pre-push / CI)"
env = { GOFLAGS = "-count=1" }
run = '''
set -e
ref=main
# On main with nothing changed the diff would be empty and check nothing: check the last commit instead.
if [ "$(git merge-base main HEAD)" = "$(git rev-parse HEAD)" ] && git diff --quiet HEAD; then
  ref=HEAD~1
fi
opts="--diff $ref --coverpkg=./... --timeout-coefficient=4"
scripts/unleash.sh $opts -E '^(e2e|internal/ui)/' .
scripts/unleash.sh $opts --arithmetic-base=false --invert-negatives=false \
  -E '^(cmd|e2e)/|^internal/([^u]|u[^i]|ui[^/])|^internal/ui/uitest/' .
'''

[tasks.check]
description = "Fast gate: build, vet, lint (Clean Code), archtest + unit tests with 100% coverage"
depends = ["build", "vet", "lint", "cover:check"]

[tasks.qa]
description = "Everything CI runs on a pull request, locally (mutation:diff needs a main branch)"
depends = ["tidy", "check", "vuln", "test:integration", "test:e2e", "mutation:diff"]
