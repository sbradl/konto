# gitleaks configuration: the default secret rules, plus rules for the personal data a finance tool can leak.
# The pre-commit hook (.githooks/pre-commit) and CI (mise run secrets) both read this file.

[extend]
useDefault = true

# An IBAN: country code, check digits, 11 to 30 more letters or digits, in groups of four or not.
[[rules]]
id = "iban"
description = "IBAN (bank account number)"
regex = '''\b[A-Z]{2}[0-9]{2}(?: ?[A-Z0-9]{4}){2,7}(?: ?[A-Z0-9]{1,3})?\b'''
keywords = []

  # Fake or published example IBANs only. Add a new fixture IBAN here; never a real one.
  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = [
    '''^DE00 ?0000 ?0000 ?0000 ?0000 ?[0-9]{2}$''',  # konto's own fakes: DE000…01 to DE000…99
    '''^DE89 ?3704 ?0044 ?0532 ?0130 ?00$''',        # the standard example IBAN
    '''^DE27 ?1007 ?7777 ?0209 ?2997 ?00$''',
    '''^DE91 ?1000 ?0000 ?0123 ?4567 ?89$''',        # Bundesbank example
    '''^DE75 ?5121 ?0800 ?1245 ?1261 ?99$''',
    '''^DE55 ?5001 ?0517 ?5407 ?3249 ?99$''',
    '''^DE44 ?5001 ?0517 ?5407 ?3249 ?31$''',
    '''^DE12 ?5001 ?0517 ?0648 ?4898 ?90$''',
    '''^DE02 ?1203 ?0000 ?0000 ?2020 ?51$''',
  ]

# A raw bank export: real statements never belong in the repository.
[[rules]]
id = "bank-export-file"
description = "Bank statement export (real transactions)"
path = '''(?i)(^|/)(kontoumsaetze|umsaetze|ums[aä]tze)[^/]*\.csv$|(^|/)\.scratch/konto-spec/samples/'''

# An email address. Only placeholder and no-reply domains may appear.
[[rules]]
id = "email-address"
description = "Email address"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''
keywords = ["@"]

  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = [
    '''@(?:[a-z0-9-]+\.)*example\.(?:com|org|net)$''',
    '''@users\.noreply\.github\.com$''',
    '''^noreply@''',
  ]

# A real home directory: it names the user. The fixtures use /home/alex and /home/me.
[[rules]]
id = "home-path"
description = "Path into a real home directory"
# The secret is the user name alone: gitleaks' default allowlist drops any secret that is a whole /home/… path.
regex = '''/(?:home|Users)/([A-Za-z0-9._-]+)'''
secretGroup = 1
keywords = ["/home/", "/users/"]

  [[rules.allowlists]]
  regexTarget = "secret"
  regexes = ['''^(?:alex|me|user|runner)$''']
