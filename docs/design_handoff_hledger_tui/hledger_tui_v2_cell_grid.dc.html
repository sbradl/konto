/* ---------- character grid ---------- */
function grid(){const g=[];for(let y=0;y<H;y++){const r=[];for(let x=0;x<W;x++)r.push({c:' ',f:C.fg,b:null,o:0});g.push(r);}return g;}
function put(g,x,y,s,o){o=o||{};if(y<0||y>=H)return;s=String(s);
 for(let i=0;i<s.length;i++){const cx=x+i;if(cx<0||cx>=W)break;const q=g[y][cx];
  q.c=s[i];if(o.f)q.f=o.f;if(o.b)q.b=o.b;q.o=o.o?1:0;}}
function fill(g,x,y,w,o){put(g,x,y,' '.repeat(Math.max(0,w)),o);}
function tr(s,w){s=String(s);return s.length<=w?s:(w<2?s.slice(0,w):s.slice(0,w-1)+'…');}
function padr(s,w){s=tr(s,w);return s+' '.repeat(w-s.length);}
function padl(s,w){s=tr(s,w);return ' '.repeat(w-s.length)+s;}
function box(g,x,y,w,h,title,hint){
 const b={f:C.dim};
 put(g,x,y,'╭'+'─'.repeat(w-2)+'╮',b);
 put(g,x,y+h-1,'╰'+'─'.repeat(w-2)+'╯',b);
 for(let i=1;i<h-1;i++){put(g,x,y+i,'│',b);put(g,x+w-1,y+i,'│',b);}
 if(title)put(g,x+2,y,' '+title+' ',{f:C.cyn,o:1});
 if(hint){const t=tr(hint,w-6-(title?title.length+4:0));if(t.length>0)put(g,x+w-3-t.length,y,' '+t+' ',{f:C.dim});}
}
function bar(v,w){const f=Math.min(w,Math.round(Math.min(v,1.25)/1.25*w));return '█'.repeat(f)+'░'.repeat(w-f);}

/* ---------- braille canvas: 2x4 subcells, as ntcharts does ---------- */
const DOTS=[[0x01,0x02,0x04,0x40],[0x08,0x10,0x20,0x80]];
function braille(cw,ch){
 const cells=new Array(cw*ch).fill(0),cols=new Array(cw*ch).fill(null);
 return {cw:cw,ch:ch,px:cw*2,py:ch*4,
  set(x,y,col){x=Math.round(x);y=Math.round(y);
   if(x<0||y<0||x>=this.px||y>=this.py)return;
   const i=Math.floor(y/4)*cw+Math.floor(x/2);
   cells[i]|=DOTS[x%2][y%4];cols[i]=col;},
  line(x0,y0,x1,y1,col){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);
   for(let s=0;s<=n;s++)this.set(x0+(x1-x0)*s/n,y0+(y1-y0)*s/n,col);},
  series(vals,x0,x1,min,max,col,fillTo){
   const n=vals.length;const sx=i=>x0+(x1-x0)*i/(n-1);
   const sy=v=>this.py-1-(v-min)/(max-min)*(this.py-1);
   for(let i=0;i<n-1;i++)this.line(sx(i),sy(vals[i]),sx(i+1),sy(vals[i+1]),col);
   if(fillTo!==undefined)for(let i=0;i<n;i++){const yy=sy(vals[i]);
    for(let y=yy;y<this.py;y+=4)this.set(sx(i),y,col);}
   return {sx:sx,sy:sy};},
  draw(g,gx,gy){for(let cy=0;cy<ch;cy++)for(let cx=0;cx<cw;cx++){
   const i=cy*cw+cx;if(!cells[i])continue;
   put(g,gx+cx,gy+cy,String.fromCharCode(0x2800+cells[i]),{f:cols[i]||C.fg});}}
 };
}

function toLines(g){
 return g.map(row=>{const segs=[];let cur=null,key=null;
  for(const q of row){const k=q.f+'|'+(q.b||'-')+'|'+q.o;
   if(k!==key){key=k;cur={t:'',style:'color:'+q.f+(q.b?';background:'+q.b:'')+(q.o?';font-weight:700':'')};segs.push(cur);}
   cur.t+=q.c;}
  return {segs:segs};});
}

class Component extends DCLogic {
  state={screen:'dashboard',cur:{dashboard:2,import:9,scheduled:2},field:1,
   val:'native',file:0,doctor:false,whichKey:null,cmdOpen:false,cmdText:''};

  componentDidMount(){if(this.root)this.root.focus();}
  set(k,v){this.setState({[k]:v});}
  go(id){this.setState({screen:id,cmdOpen:false,cmdText:'',whichKey:null});}
  len(){const s=this.state.screen;
   if(s==='dashboard')return RECENT.length;if(s==='import')return CSV.length;
   if(s==='scheduled')return SCHED.length;if(s==='entry')return FORM.length;return 0;}
  move(d){const s=this.state.screen,n=this.len();if(!n)return;
   if(s==='entry'){this.setState({field:Math.max(0,Math.min(n-1,this.state.field+d))});return;}
   const cur={...this.state.cur};cur[s]=Math.max(0,Math.min(n-1,(cur[s]||0)+d));this.setState({cur});}

  onKey=(e)=>{
   const k=e.key,st=this.state;
   if(st.cmdOpen){
    if(k==='Escape'){this.setState({cmdOpen:false,cmdText:''});e.preventDefault();return;}
    if(k==='Enter'){const m=CMDS.filter(c=>c[0].startsWith(':'+st.cmdText))[0];
     if(m&&m[2])this.go(m[2]);else this.setState({cmdOpen:false,cmdText:''});e.preventDefault();return;}
    if(k==='Backspace'){this.setState({cmdText:st.cmdText.slice(0,-1)});e.preventDefault();return;}
    if(k==='Tab'){const m=CMDS.filter(c=>c[0].startsWith(':'+st.cmdText))[0];
     if(m)this.setState({cmdText:m[0].slice(1)});e.preventDefault();return;}
    if(k.length===1){this.setState({cmdText:st.cmdText+k});e.preventDefault();}
    return;}
   if(st.whichKey==='g'){const t=SCREENS.find(s=>s.key===k);
    if(t){this.go(t.id);e.preventDefault();return;}
    this.setState({whichKey:null});e.preventDefault();return;}
   if(k==='Escape'){this.setState({whichKey:null,doctor:false});e.preventDefault();return;}
   if(k===':'){this.setState({cmdOpen:true,cmdText:'',whichKey:null,doctor:false});e.preventDefault();return;}
   if(k==='?'){this.setState({whichKey:st.whichKey?null:'root',doctor:false});e.preventDefault();return;}
   if(k==='g'){this.setState({whichKey:'g'});e.preventDefault();return;}
   if(k>='1'&&k<='4'){this.go(SCREENS[+k-1].id);e.preventDefault();return;}
   if(k==='!'){this.setState({doctor:!st.doctor,whichKey:null});e.preventDefault();return;}
   if(k==='v'){this.set('val',st.val==='native'?'eur':'native');e.preventDefault();return;}
   if(k==='j'||k==='ArrowDown'){this.move(1);e.preventDefault();return;}
   if(k==='k'||k==='ArrowUp'){this.move(-1);e.preventDefault();return;}
   if(k==='Tab'&&st.screen==='entry'){this.setState({field:(st.field+1)%FORM.length});e.preventDefault();return;}
  };

  chrome(g){
   const st=this.state;let x=1;
   SCREENS.forEach((s,i)=>{
    const on=s.id===st.screen,lbl=' '+s.label+' ';
    put(g,x,0,lbl,on?{f:C.wht,b:C.sel,o:1}:{f:C.dim});
    x+=lbl.length;
    if(i<SCREENS.length-1){put(g,x,0,'│',{f:C.dim});x+=1;}
   });
   const val=st.val==='eur'?'-V market':'at cost';
   put(g,W-56,0,'~/finance/2026.journal',{f:C.dim});
   put(g,W-32,0,'1284 txns',{f:C.dim});
   put(g,W-21,0,val,{f:C.yel});
   put(g,W-9,0,'● clean',{f:C.grn});
   put(g,0,1,'─'.repeat(W),{f:C.dim});
  }

  status(g){
   const st=this.state;
   if(st.cmdOpen){
    fill(g,0,H-1,W,{b:C.bg});
    put(g,0,H-1,':'+st.cmdText,{f:C.yel,o:1});
    put(g,1+st.cmdText.length,H-1,'█',{f:C.yel});
    return;}
   fill(g,0,H-1,W,{b:C.sel});
   const mode=st.whichKey==='g'?' PENDING g ':' NORMAL ';
   put(g,0,H-1,mode,{f:C.bg,b:st.whichKey==='g'?C.yel:C.blu,o:1});
   let x=mode.length+2;
   put(g,x,H-1,st.screen,{f:C.wht,b:C.sel,o:1});x+=st.screen.length+3;
   put(g,x,H-1,HINTS[st.screen]||'',{f:C.fg,b:C.sel});
   const n=this.len(),cur=st.screen==='entry'?st.field:(st.cur[st.screen]||0);
   const pos=n?((cur+1)+'/'+n):'—';
   put(g,W-pos.length-12,H-1,pos,{f:C.fg,b:C.sel});
   put(g,W-9,H-1,'? keys',{f:C.fg,b:C.sel});
  }

    put(g,145,y,padl((tot>=0?'+':'')+tot.toFixed(2),32),{f:tot>=0?C.grn:C.fg});
   });
   put(g,112,49,'─'.repeat(66),{f:C.dim});
   put(g,112,50,padr('net scheduled per year',25),{f:C.wht,o:1});
   put(g,145,50,padl('+21285.26',32),{f:C.grn,o:1});
   put(g,112,52,'Paused entries are excluded.',{f:C.dim});
  }

  /* ---------- overlays, composited into the buffer ---------- */
  overlay(g){
   const st=this.state;
   if(st.doctor){
    const h=CHECKS.length+4,y=H-1-h;
    for(let i=0;i<h;i++)fill(g,0,y+i,W,{b:C.bg});
    box(g,0,y,W,h,'hledger check --strict','2 errors · 3 warnings · ⏎ open at line · ! closes');
    CHECKS.forEach((c,i)=>{
     const yy=y+2+i,sev=c[0].trim();
     if(i===0)fill(g,1,yy,W-2,{b:C.sel});
     const bg=i===0?C.sel:null;
     put(g,3,yy,c[0],{f:sev==='ERR'?C.red:(sev==='WARN'?C.yel:C.grn),b:bg,o:1});
     put(g,9,yy,padr(c[1],W-40),{f:sev==='OK'?C.dim:C.fg,b:bg});
     put(g,W-3-c[2].length,yy,c[2],{f:C.dim,b:bg});
    });
    return;}
   if(st.whichKey){
    const items=st.whichKey==='g'?WK_G:WK_ROOT,rows=Math.ceil(items.length/4),h=rows+4,y=H-1-h;
    for(let i=0;i<h;i++)fill(g,0,y+i,W,{b:C.bg});
    box(g,0,y,W,h,st.whichKey==='g'?'g — goto':'keys','Esc closes');
    items.forEach((it,i)=>{
     const col=i%4,r=Math.floor(i/4),xx=3+col*44,yy=y+2+r;
     put(g,xx,yy,padl(it[0],4),{f:C.yel,o:1});
     put(g,xx+6,yy,'→',{f:C.dim});
     put(g,xx+8,yy,tr(it[1],30),{f:C.fg});
    });
    return;}
   if(st.cmdOpen){
    const m=CMDS.filter(c=>c[0].startsWith(':'+st.cmdText)).slice(0,8);
    if(!m.length)return;
    const h=m.length+2,y=H-1-h;
    for(let i=0;i<h;i++)fill(g,0,y+i,W,{b:C.bg});
    box(g,0,y,W,h,null,null);
    m.forEach((c,i)=>{
     const yy=y+1+i;
     if(i===0)fill(g,1,yy,W-2,{b:C.sel});
     const bg=i===0?C.sel:null;
     put(g,3,yy,padr(c[0],24),{f:i===0?C.yel:C.fg,b:bg,o:i===0?1:0});
     put(g,29,yy,c[1],{f:C.dim,b:bg});
    });}
  }

  renderVals(){
   const g=grid(),s=this.state.screen;
   this.chrome(g);
   if(s==='dashboard')this.dash(g);
   else if(s==='import')this.imp(g);
   else if(s==='entry')this.entry(g);
   else this.sched(g);
   this.overlay(g);
   this.status(g);
   return {lines:toLines(g),rootRef:el=>{this.root=el;},onKey:this.onKey};
  }
}
</script>
