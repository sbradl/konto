version: "2"

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
        - name: unexported-return
        - name: error-return
        - name: error-strings
        - name: context-as-argument
  exclusions:
    rules:
      # test files: allow long funcs, unchecked errors, dot-imports
      - path: _test\.go
        linters: [errcheck, revive]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sbradl/konto
