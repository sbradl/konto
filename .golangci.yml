version: "2"

# Static enforcement of Clean Code (Martin, 2nd ed.), plus the Pragmatic
# Programmer rules a tool can see. Each linter names the rule it stands for;
# what no tool can judge is left to the review skill (.claude/skills/clean-review).
# Loosen a threshold only with a recorded reason, never silently.

run:
  build-tags: [integration, e2e]

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # --- Functions: small, one thing, one level of abstraction ---------------
    - funlen      # small functions
    - gocyclo     # few paths through a function
    - gocognit    # readable top-down; no tangled control flow
    - nestif      # nested blocks are one line (extract the body)
    - maintidx    # overall maintainability
    - revive      # arguments, flag arguments, early return … (rules below)
    - unparam     # no unused or always-constant parameters
    - nakedret    # no hidden results in long functions
    - dogsled     # no call whose results are mostly thrown away
    # --- Names ----------------------------------------------------------------
    - varnamelen  # names sized to their scope
    - predeclared # don't shadow built-in names (disinformation)
    - errname     # ErrFoo sentinels, FooError types: one word per concept
    - misspell
    - inamedparam # interface parameters carry names
    # --- Comments -------------------------------------------------------------
    - godot       # doc comments are sentences
    - godox       # no TODO/FIXME left behind (broken windows)
    - dupword     # no "the the"
    - gocritic    # includes commentedOutCode (below)
    # --- DRY / magic values ---------------------------------------------------
    - dupl        # duplicated blocks
    - goconst     # repeated literals become a named constant
    - mnd         # no magic numbers
    # --- Error handling -------------------------------------------------------
    - errorlint   # wrap with %w, compare with errors.Is/As
    - wrapcheck   # errors crossing a boundary carry context
    - nilnil      # don't return nil, nil ("don't return null")
    - nilerr      # don't drop an error and return nil
    - forcetypeassert # no unchecked type assertion (crash early, not later)
    - errchkjson
    # --- Side effects, global state, boundaries -----------------------------
    - gochecknoglobals # no mutable package state
    - gochecknoinits   # no hidden side effects at import time
    - forbidigo        # no printing outside main (below)
    - reassign         # don't reassign other packages' variables
    - containedctx     # contexts are passed, not stored
    - contextcheck
    - noctx
    - interfacebloat   # small interfaces (interface segregation)
    - recvcheck        # consistent receivers per type
    # --- Switches / conditionals ---------------------------------------------
    - exhaustive  # switches over enums cover every case
    # --- Formatting (vertical and horizontal) --------------------------------
    - lll         # short lines
    - nlreturn    # blank line before a return, unless it opens its block
    - wsl_v5      # blank line before an if, unless it opens its block or checks the line above
    - whitespace  # no blank line hugging a block's braces
    # --- Tests (F.I.R.S.T., test code is production code) --------------------
    - thelper
    - usetesting
    - tparallel
    # --- Hygiene / idiom --------------------------------------------------------
    - bodyclose
    - copyloopvar
    - durationcheck
    - gosec
    - intrange
    - makezero
    - mirror
    - modernize
    - nolintlint  # every //nolint names its linter and says why
    - perfsprint
    - prealloc
    - unconvert
    - usestdlibvars
    - wastedassign

  settings:
    funlen:
      lines: 25 # blank lines count; ~20 lines of code
      statements: 25
      ignore-comments: true
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 12
    nestif:
      min-complexity: 3
    maintidx:
      under: 30
    nakedret:
      max-func-lines: 0 # no naked returns at all
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    mnd:
      ignored-numbers: ["0", "1", "2", "10", "100", "0o644", "0o755"]
    lll:
      line-length: 120
      tab-width: 4
    varnamelen:
      max-distance: 8
      ignore-decls:
        - t *testing.T
        - b *testing.B
        - tb testing.TB
        - w io.Writer
        - r io.Reader
        - i int
        - n int
        - ok bool
        - wg sync.WaitGroup
        - mu sync.Mutex
      ignore-names: [err, ok, id, tt, tc]
    wsl_v5:
      default: none
      enable: [if]
    godox:
      keywords: [TODO, FIXME, HACK, XXX, BUG]
    interfacebloat:
      max: 5
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
          msg: no builtin print; return values or use the UI
        - pattern: ^fmt\.Print(f|ln)?$
          msg: no printing outside cmd/konto; return the value instead
    gocritic:
      enabled-tags: [diagnostic, style, performance, opinionated, experimental]
      disabled-checks:
        - hugeParam        # value semantics for small domain VOs are intended
        - paramTypeCombine # explicit parameter types read better in signatures
        - whyNoLint        # covered by nolintlint
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-all-rules: false
      rules:
        # documentation & naming
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: confusing-naming
        - name: unexported-naming
        - name: import-shadowing
        - name: redefines-builtin-id
        # functions
        - name: argument-limit        # 0–2 ideal, 3 needs a reason
          arguments: [4]
        - name: function-result-limit
          arguments: [3]
        - name: flag-parameter        # no boolean flag arguments
        - name: cognitive-complexity
          arguments: [12]
        - name: cyclomatic
          arguments: [10]
        - name: max-control-nesting
          arguments: [3]
        - name: confusing-results
        - name: modifies-parameter    # no hidden side effects on arguments
        - name: modifies-value-receiver
        - name: unused-parameter
        - name: unused-receiver
        # control flow
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: if-return
        - name: unnecessary-stmt
        - name: identical-branches
        - name: unconditional-recursion
        - name: deep-exit             # os.Exit/log.Fatal only in main
        - name: bare-return
        # errors
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: errorf
        - name: unhandled-error
          # writes that cannot fail, or whose failure (a closed stdout) nothing can act on
          arguments:
            - fmt.Printf
            - fmt.Println
            - fmt.Print
            - fmt.Fprintf
            - fmt.Fprintln
            - fmt.Fprint
            - strings.Builder.WriteString
            - strings.Builder.WriteByte
            - bytes.Buffer.Write
            - bytes.Buffer.WriteString
        # files & structure
        - name: file-length-limit     # files of a few hundred lines
          arguments: [{ max: 400, skipComments: true, skipBlankLines: true }]
        - name: max-public-structs
          arguments: [6]
        - name: context-as-argument
        - name: context-keys-type
        - name: unexported-return
        - name: struct-tag
        - name: atomic
        - name: defer
        - name: range-val-address
        - name: waitgroup-by-value
        - name: datarace
        - name: use-any
        - name: useless-break
        - name: empty-block
        - name: empty-lines

  exclusions:
    rules:
      # Test code meets the same bar for names, errors and structure, but table
      # tests are long and repetitive by design, and test fixtures are data.
      - path: _test\.go
        linters: [funlen, dupl, goconst, mnd, lll, maintidx, gochecknoglobals, gochecknoinits, forcetypeassert, wrapcheck,
          forbidigo, varnamelen]
      # Tests and the harness exec programs and write temp files by design.
      - path: _test\.go
        linters: [gosec]
      - path: _test\.go
        text: "(file-length-limit|max-public-structs|unhandled-error|flag-parameter|argument-limit)"
      # main is the one place that prints and exits.
      - path: ^cmd/
        linters: [forbidigo]
      - path: ^cmd/
        text: deep-exit
      # The hledger shim is a tiny test double whose job is to print and exit.
      - path: ^e2e/hledgershim/
        linters: [forbidigo, gochecknoglobals, gosec]
      - path: ^e2e/hledgershim/
        text: deep-exit

formatters:
  enable:
    - gofumpt   # stricter gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sbradl/konto
