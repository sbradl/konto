name: Set up konto toolchain
description: Installs the mise-pinned toolchain (go, golangci-lint, gotestsum, gremlins, govulncheck, hledger) and restores Go caches.
runs:
  using: composite
  steps:
    # Restore the Go caches before mise installs tools: tools built with `go install`
    # write into the module cache, and restoring on top of them fails with "File exists".
    - uses: actions/cache@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
        restore-keys: go-${{ runner.os }}-
    - uses: jdx/mise-action@v5
      with:
        cache: true
